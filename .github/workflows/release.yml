name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check the RELEASE_TOKEN secret
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is missing. Add a fine-grained token for this repository with Contents, Issues and Pull requests set to read and write."
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      # GitHub merges the release pull request once its required CI check passes; the tag and release come on that push.
      - name: Queue the release pull request for merge
        if: steps.release.outputs.pr
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          if [ "$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            exit 0
          fi
          # GitHub may still be computing mergeability right after the pull request opens.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --auto --squash && exit 0
            sleep 15
          done
          exit 1

  upload-package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Build and test the ChatGPT and Grok packages
        run: |
          scripts/build-openai.sh
          scripts/test-openai-zip.sh
          scripts/build-grok.sh
          scripts/test-grok-zip.sh

      - name: Attach the packages to the release
        run: gh release upload "$TAG" dist/koter-openai-*.zip dist/koter-grok-*.zip -R "$GITHUB_REPOSITORY" --clobber
