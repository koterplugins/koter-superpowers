name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the Claude plugin
        run: claude plugin validate ./plugins/koter

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Check the files in the plugin folder
        run: scripts/check-plugin-folder.sh

      - name: Check the tools cited in the skills
        run: node scripts/check-tools.mjs

      - name: Build the ChatGPT package
        run: scripts/build-openai.sh

      - name: Test the ChatGPT package
        run: scripts/test-openai-zip.sh

      - name: Check for internal process notes
        run: scripts/check-public-content.sh
